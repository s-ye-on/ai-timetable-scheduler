# Shared, non-secret H2 configuration. Keep the existing database path.
spring.datasource.url=jdbc:h2:file:./data/timetable-scheduler;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver

# Initialize missing tables before JPA, then validate without automatic migration.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
# Preserve metadata lookup spelling for the existing DATABASE_TO_UPPER=false URL.
spring.jpa.database-platform=me.timetablescheduler.config.H2CaseSensitiveDialect
