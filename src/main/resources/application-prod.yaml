# 로컬 application.properties를 이미지에 포함하지 않으므로 운영 매핑을 명시한다.
spring:
  application:
    name: timetable-scheduler
  datasource:
    url: jdbc:h2:file:${H2_DATABASE_PATH:/var/lib/campus-planner/data/timetable-scheduler};MODE=MySQL;DATABASE_TO_UPPER=false;IFEXISTS=TRUE
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    redirect-context-root: false
    accesslog:
      enabled: false
  servlet:
    session:
      cookie:
        secure: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:https://campusplanner.duckdns.org/api/calendar/oauth/callback}
    scope: https://www.googleapis.com/auth/calendar
    application-name: timetable-scheduler
    time-zone: Asia/Seoul
