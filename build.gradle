plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me'
version = '0.0.1-SNAPSHOT'
description = 'timetable-scheduler'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'com.google.api-client:google-api-client:2.7.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20260225-2.0.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'llm-live' }
}

tasks.register('llmEval', Test) {
    group = 'verification'
    description = '명시적으로 승인한 실제 OpenAI 자연어 평가만 실행한다'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'llm-live' }
    filter { includeTestsMatching 'me.timetablescheduler.domain.llm.evaluation.LlmLiveEvaluationTest' }
    systemProperty 'llm.eval.task', 'live'
    systemProperty 'llm.eval.enabled', providers.gradleProperty('runLlmEval').getOrElse('false')
    systemProperty 'llm.eval.repeats', providers.gradleProperty('evalRepeats').getOrElse('1')
    systemProperty 'llm.eval.output', layout.buildDirectory.dir('llm-evaluation').get().asFile.absolutePath
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('실제 API 평가 결과를 빌드 캐시로 재사용하지 않는다') { true }
    doFirst {
        if (providers.gradleProperty('runLlmEval').getOrElse('false') != 'true'
            || System.getenv('LLM_EVAL_ALLOW_API') != 'true'
            || !System.getenv('OPENAI_API_KEY')?.trim()) {
            throw new GradleException('실제 평가는 -PrunLlmEval=true, LLM_EVAL_ALLOW_API=true, OPENAI_API_KEY가 모두 필요합니다.')
        }
        if (!(providers.gradleProperty('evalRepeats').getOrElse('1') in ['1', '3'])) {
            throw new GradleException('evalRepeats는 1 또는 3만 허용합니다.')
        }
    }
}
