# 인증서는 발급하지 않는다. 후속 단계에서 인증서 파일을 준비한 뒤 겹쳐 사용한다.
services:
  web:
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./deploy/nginx/https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_DIR:-/srv/campus-planner/certs}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
