# 인증서가 없는 초기 단계: 공개 HTTP에서 로그인·OAuth·개인정보를 제공하지 않는다.
server {
    listen 80;
    server_name campusplanner.duckdns.org;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'bootstrap-ready\n';
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 'HTTPS setup is pending.\n';
    }
}
