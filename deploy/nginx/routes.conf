# HTTPS 운영 설정과 격리된 로컬 HTTP 검증에서 공통으로 사용하는 server 내부 설정.
root /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# 브라우저가 보낸 전달 헤더를 신뢰하지 않고 Nginx가 덮어쓴다.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
# 등록·분석 POST를 프록시가 자동 재실행하지 않는다.
proxy_next_upstream off;

location = /healthz { access_log off; return 200 'ready\n'; }

location = /api/calendar/oauth/callback {
    # 실패한 upstream의 error log에도 인가 코드·state 원문을 남기지 않는다.
    access_log off;
    error_log /dev/null;
    proxy_pass http://campus_app;
}

location ~ ^/(api|tasks|timetable-slots|preferences|recommendations)(/|$) {
    proxy_pass http://campus_app;
}
location = /demo.html { proxy_pass http://campus_app; }
location ~ ^/(h2-console|actuator)(/|$) { return 404; }
location ~ (^|/)\. { return 404; }

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control 'public, immutable';
}
location = /index.html {
    add_header Cache-Control 'no-cache';
}
location / {
    try_files $uri $uri/ /index.html;
}
