user nginx;
worker_processes 2;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OAuth code/state를 포함할 수 있는 query string, 헤더, 본문은 기록하지 않는다.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # app 재생성으로 내부 IP가 바뀌어도 Docker DNS에서 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream campus_app {
        zone campus_app 64k;
        server app:8080 resolve;
    }
    include /etc/nginx/conf.d/*.conf;
}
