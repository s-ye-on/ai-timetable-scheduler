server {
    listen 80;
    server_name campusplanner.duckdns.org;
    location = /healthz { access_log off; return 200 'ready\n'; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 308 https://campusplanner.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name campusplanner.duckdns.org;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    if ($host != campusplanner.duckdns.org) { return 444; }
    include /etc/nginx/snippets/routes.conf;
}
